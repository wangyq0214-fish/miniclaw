<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>循环神经网络(RNN) 动画讲解</title>
<style>
:root {
    --bg-color: #0f172a;
    --primary: #3b82f6;
    --secondary: #8b5cf6;
    --accent: #f59e0b;
    --text-main: #f1f5f9;
    --text-dim: #94a3b8;
    --glow-blue: rgba(59, 130, 246, 0.4);
    --glow-purple: rgba(139, 92, 246, 0.4);
    --success: #10b981;
    --danger: #ef4444;
    --card-bg: #1e293b;
    --border: #334155;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    overflow: hidden;
    height: 100vh;
}

#viewport {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}
#viewport::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
        linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
}

#progress {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    width: 0%;
    z-index: 100;
    transition: width 0.1s linear;
}

#header {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 50;
    pointer-events: none;
}
#header h1 {
    font-size: 1.3rem;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 1px;
}
#header p {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 2px;
}

#scene-indicator {
    position: fixed;
    top: 58px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 50;
}
.scene-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--border);
    transition: all 0.4s;
}
.scene-dot.active {
    background: var(--primary);
    box-shadow: 0 0 10px var(--glow-blue);
    transform: scale(1.3);
}

#stage {
    position: absolute;
    inset: 80px 0 100px 0;
    z-index: 10;
}

[id^="scene-"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
[id^="scene-"].active {
    opacity: 1;
    pointer-events: auto;
}

#subtitle-container {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    width: 90%;
    max-width: 700px;
}
#subtitle-box {
    background: rgba(30, 41, 59, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 24px;
    text-align: center;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s;
}
#subtitle-cn {
    font-size: 1.05rem;
    color: var(--text-main);
    line-height: 1.5;
    letter-spacing: 0.5px;
}

/* SVG animation helpers */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
}
@keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 4px var(--glow-blue)); }
    50%      { filter: drop-shadow(0 0 16px var(--glow-blue)); }
}
@keyframes dash {
    to { stroke-dashoffset: 0; }
}
@keyframes glowPulse {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 1; }
}
.fade-in-up { animation: fadeInUp 0.6s ease forwards; }
.fade-in    { animation: fadeIn 0.5s ease forwards; }

/* Scene-specific text styles */
.scene-title {
    font-size: 1.6rem;
    font-weight: 700;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
}
.scene-desc {
    color: var(--text-dim);
    font-size: 0.95rem;
    max-width: 600px;
    text-align: center;
    line-height: 1.6;
}
.formula-box {
    background: var(--card-bg);
    border: 1px solid var(--primary);
    border-radius: 10px;
    padding: 14px 28px;
    font-size: 1.15rem;
    color: #c4b5fd;
    font-family: 'Courier New', monospace;
    margin: 12px 0;
    box-shadow: 0 0 20px var(--glow-purple);
    text-align: center;
}
.tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    margin: 2px;
}
.tag-blue   { background: rgba(59,130,246,0.2); color: #93c5fd; border: 1px solid rgba(59,130,246,0.4); }
.tag-purple { background: rgba(139,92,246,0.2); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.4); }
.tag-amber  { background: rgba(245,158,11,0.2); color: #fcd34d; border: 1px solid rgba(245,158,11,0.4); }
.tag-green  { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.4); }
.tag-red    { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); }
</style>
</head>
<body>
<div id="viewport">
    <div id="progress"></div>
    <div id="header"><h1>循环神经网络 (RNN) 动画讲解</h1><p>从序列数据到 LSTM 门控机制</p></div>
    <div id="scene-indicator"></div>
    <div id="stage">
        <div id="scene-0"></div>
        <div id="scene-1"></div>
        <div id="scene-2"></div>
        <div id="scene-3"></div>
        <div id="scene-4"></div>
    </div>
    <div id="subtitle-container">
        <div id="subtitle-box"><div id="subtitle-cn">准备开始...</div></div>
    </div>
</div>

<script>
/* ══════════════════════════════════════════════════
   常量 & 字幕
   ══════════════════════════════════════════════════ */
const TOTAL_DURATION = 103611;
const TOTAL_SCENES = 5;
let startTime;

const subtitles = [
            { time: 0,    cn: "循环神经网络，简称 RNN，是处理序列数据的核心架构" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/0_051011fdc1d3.mp3" },
            { time: 6277,    cn: "传统神经网络假设输入之间相互独立，无法利用序列中的时序信息" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/1_ddae902d8dc7.mp3" },
            { time: 13222,    cn: "RNN 的核心思想是引入隐藏状态，在时间步之间传递信息" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/2_e14fb6df7aba.mp3" },
            { time: 19722,    cn: "每个时间步，RNN 单元接收当前输入和上一步的隐藏状态" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/3_6ecd5254237e.mp3" },
            { time: 26222,    cn: "通过 tanh 激活函数，计算新的隐藏状态并输出" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/4_7c60744c5b6b.mp3" },
            { time: 32055,    cn: "将 RNN 沿时间轴展开，就得到一个深层网络结构" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/5_64e11c886fa2.mp3" },
            { time: 37888,    cn: "展开后可以看到，权重在所有时间步之间共享" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/6_5ed5f7895e70.mp3" },
            { time: 42833,    cn: "这意味着 RNN 用同一组参数处理任意长度的序列" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/7_c9a4fcda8dbb.mp3" },
            { time: 48666,    cn: "现在我们用具体数值演示前向传播的计算过程" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/8_f65c5827ef82.mp3" },
            { time: 53611,    cn: "输入维度为 2，隐藏维度为 3，从第一个时间步开始" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/9_9d126a0b4bd6.mp3" },
            { time: 59666,    cn: "矩阵乘法加上偏置，经过 tanh 激活得到新的隐藏状态" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/10_9f4c44de3998.mp3" },
            { time: 66166,    cn: "隐藏状态传递到下一步，与新输入共同参与计算" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/11_7cbcb33c718b.mp3" },
            { time: 71333,    cn: "然而标准 RNN 存在严重的梯度消失问题" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/12_7d438b4ab5fd.mp3" },
            { time: 76277,    cn: "反向传播时梯度需要连乘权重矩阵，导致指数级衰减或爆炸" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/13_2441da04a5a8.mp3" },
            { time: 82555,    cn: "LSTM 通过门控机制解决了这个问题" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/14_a6e117e0d7d8.mp3" },
            { time: 87055,    cn: "遗忘门决定丢弃哪些旧信息，输入门决定写入哪些新信息" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/15_e52d71c67e44.mp3" },
            { time: 93111,    cn: "细胞状态像一条高速公路，让信息可以无损地长距离传递" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/16_8949933278fb.mp3" },
            { time: 99166,    cn: "输出门控制当前隐藏状态中暴露哪些细胞信息" , audio: "/api/tts/audio/2/2026-05-04-rnn-动画/17_00a3e00d7794.mp3" }
        ];

/* ══════════════════════════════════════════════════
   工具函数
   ══════════════════════════════════════════════════ */
function el(tag, attrs = {}, children = []) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
        if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
        else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
        else e.setAttribute(k, v);
    }
    for (const c of (Array.isArray(children) ? children : [children])) {
        if (typeof c === 'string') e.appendChild(document.createTextNode(c));
        else if (c) e.appendChild(c);
    }
    return e;
}

function makeSVG(w, h) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    return svg;
}

function svgEl(tag, attrs = {}) {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
}

function showScene(idx) {
    document.getElementById('scene-' + idx).classList.add('active');
    document.querySelectorAll('.scene-dot').forEach((d, i) => {
        d.classList.toggle('active', i === idx);
    });
}
function clearScene(idx) {
    document.getElementById('scene-' + idx).classList.remove('active');
    document.getElementById('scene-' + idx).innerHTML = '';
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function updateProgress() {
    const elapsed = Date.now() - startTime;
    const pct = Math.min(100, (elapsed / TOTAL_DURATION) * 100);
    document.getElementById('progress').style.width = pct + '%';
}

function updateSubtitle(elapsed) {
    let text = subtitles[0].cn;
    for (const s of subtitles) {
        if (elapsed >= s.time) text = s.cn;
        else break;
    }
    const el = document.getElementById('subtitle-cn');
    if (el.textContent !== text) {
        el.style.opacity = '0';
        setTimeout(() => { el.textContent = text; el.style.opacity = '1'; }, 150);
    }
}

function waitForSubtitle(keyword) {
    return new Promise(resolve => {
        const check = setInterval(() => {
            const cn = document.getElementById('subtitle-cn').textContent;
            if (cn.includes(keyword)) { clearInterval(check); resolve(); }
        }, 200);
    });
}

/* ══════════════════════════════════════════════════
   Scene 0: 序列数据 & RNN 动机
   ══════════════════════════════════════════════════ */
async function scene0() {
    const s = document.getElementById('scene-0');

    // Title
    const title = el('div', { class: 'scene-title fade-in-up' }, ['为什么需要 RNN？']);
    s.appendChild(title);
    await sleep(800);

    // SVG: sequence data illustration
    const svg = makeSVG(700, 260);
    svg.style.opacity = '0';
    svg.classList.add('fade-in');
    svg.style.animationDelay = '0.3s';

    // Draw sequence tokens
    const words = ['我', '喜欢', '深度', '学习'];
    const colors = ['#3b82f6', '#8b5cf6', '#f59e0b', '#10b981'];
    words.forEach((w, i) => {
        const x = 80 + i * 150;
        const g = svgEl('g', {});
        g.style.opacity = '0';
        g.style.animation = `fadeInUp 0.5s ease ${0.5 + i * 0.2}s forwards`;

        const rect = svgEl('rect', { x, y: 40, width: 100, height: 50, rx: 10, fill: colors[i], opacity: '0.85' });
        g.appendChild(rect);
        const txt = svgEl('text', { x: x + 50, y: 72, 'text-anchor': 'middle', fill: '#fff', 'font-size': '18', 'font-weight': '600' });
        txt.textContent = w;
        g.appendChild(txt);

        // Arrow between tokens
        if (i < words.length - 1) {
            const arrow = svgEl('line', { x1: x + 105, y1: 65, x2: x + 145, y2: 65, stroke: '#64748b', 'stroke-width': 2, 'marker-end': 'url(#arrowGray)' });
            g.appendChild(arrow);
        }
        svg.appendChild(g);
    });

    // Arrow marker
    const defs = svgEl('defs', {});
    const marker = svgEl('marker', { id: 'arrowGray', markerWidth: 8, markerHeight: 6, refX: 8, refY: 3, orient: 'auto' });
    marker.appendChild(svgEl('path', { d: 'M0,0 L8,3 L0,6 Z', fill: '#64748b' }));
    defs.appendChild(marker);
    const markerB = svgEl('marker', { id: 'arrowBlue', markerWidth: 8, markerHeight: 6, refX: 8, refY: 3, orient: 'auto' });
    markerB.appendChild(svgEl('path', { d: 'M0,0 L8,3 L0,6 Z', fill: '#3b82f6' }));
    defs.appendChild(markerB);
    const markerP = svgEl('marker', { id: 'arrowPurple', markerWidth: 8, markerHeight: 6, refX: 8, refY: 3, orient: 'auto' });
    markerP.appendChild(svgEl('path', { d: 'M0,0 L8,3 L0,6 Z', fill: '#8b5cf6' }));
    defs.appendChild(markerP);
    const markerA = svgEl('marker', { id: 'arrowAmber', markerWidth: 8, markerHeight: 6, refX: 8, refY: 3, orient: 'auto' });
    markerA.appendChild(svgEl('path', { d: 'M0,0 L8,3 L0,6 Z', fill: '#f59e0b' }));
    defs.appendChild(markerA);
    svg.appendChild(defs);

    // Label
    const label = svgEl('text', { x: 350, y: 120, 'text-anchor': 'middle', fill: '#94a3b8', 'font-size': '14' });
    label.textContent = '↑ 序列数据：每个元素的含义依赖上下文';
    svg.appendChild(label);

    // Cross vs Check comparison
    // MLP cross
    const crossG = svgEl('g', {});
    crossG.style.opacity = '0';
    crossG.style.animation = 'fadeInUp 0.5s ease 1.5s forwards';
    const crossRect = svgEl('rect', { x: 100, y: 150, width: 220, height: 80, rx: 10, fill: '#1e293b', stroke: '#ef4444', 'stroke-width': 2, 'stroke-dasharray': '6,4' });
    crossG.appendChild(crossRect);
    const crossTxt = svgEl('text', { x: 210, y: 185, 'text-anchor': 'middle', fill: '#fca5a5', 'font-size': '15', 'font-weight': '600' });
    crossTxt.textContent = '✗ MLP: 输入独立假设';
    crossG.appendChild(crossTxt);
    const crossSub = svgEl('text', { x: 210, y: 210, 'text-anchor': 'middle', fill: '#94a3b8', 'font-size': '12' });
    crossSub.textContent = '无法捕捉时序依赖';
    crossG.appendChild(crossSub);
    svg.appendChild(crossG);

    // RNN check
    const checkG = svgEl('g', {});
    checkG.style.opacity = '0';
    checkG.style.animation = 'fadeInUp 0.5s ease 2s forwards';
    const checkRect = svgEl('rect', { x: 380, y: 150, width: 220, height: 80, rx: 10, fill: '#1e293b', stroke: '#10b981', 'stroke-width': 2 });
    checkG.appendChild(checkRect);
    const checkTxt = svgEl('text', { x: 490, y: 185, 'text-anchor': 'middle', fill: '#6ee7b7', 'font-size': '15', 'font-weight': '600' });
    checkTxt.textContent = '✓ RNN: 隐藏状态传递记忆';
    checkG.appendChild(checkTxt);
    const checkSub = svgEl('text', { x: 490, y: 210, 'text-anchor': 'middle', fill: '#94a3b8', 'font-size': '12' });
    checkSub.textContent = '利用上下文信息';
    checkG.appendChild(checkSub);
    svg.appendChild(checkG);

    s.appendChild(svg);

    // Formula
    await sleep(2500);
    const formula = el('div', { class: 'formula-box fade-in-up', style: { animationDelay: '0s' } }, [
        'hₜ = tanh(Wₓₕ · xₜ + Wₕₕ · hₜ₋₁ + b)'
    ]);
    s.appendChild(formula);
}

/* ══════════════════════════════════════════════════
   Scene 1: 时间展开
   ══════════════════════════════════════════════════ */
async function scene1() {
    const s = document.getElementById('scene-1');

    const title = el('div', { class: 'scene-title fade-in-up' }, ['RNN 沿时间轴展开']);
    s.appendChild(title);
    await sleep(600);

    const svg = makeSVG(750, 320);
    svg.style.opacity = '0';
    svg.classList.add('fade-in');
    svg.style.animationDelay = '0.3s';
    svg.appendChild(svgEl('defs', {}));
    svg.querySelector('defs').innerHTML = `
        <marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <path d="M0,0 L8,3 L0,6 Z" fill="#3b82f6"/>
        </marker>
        <marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <path d="M0,0 L8,3 L0,6 Z" fill="#8b5cf6"/>
        </marker>
    `;

    const steps = ['t=1', 't=2', 't=3', 't=4'];
    const xPositions = [80, 240, 400, 560];

    steps.forEach((label, i) => {
        const x = xPositions[i];
        const g = svgEl('g', {});
        g.style.opacity = '0';
        g.style.animation = `fadeInUp 0.5s ease ${0.3 + i * 0.4}s forwards`;

        // RNN cell
        const cell = svgEl('rect', { x, y: 100, width: 90, height: 70, rx: 16, fill: '#1e293b', stroke: '#3b82f6', 'stroke-width': 2 });
        g.appendChild(cell);
        const cellTxt = svgEl('text', { x: x + 45, y: 128, 'text-anchor': 'middle', fill: '#93c5fd', 'font-size': '13', 'font-weight': '600' });
        cellTxt.textContent = 'RNN';
        g.appendChild(cellTxt);
        const cellLabel = svgEl('text', { x: x + 45, y: 152, 'text-anchor': 'middle', fill: '#64748b', 'font-size': '11' });
        cellLabel.textContent = label;
        g.appendChild(cellLabel);

        // Input x_t
        const inRect = svgEl('rect', { x: x + 15, y: 220, width: 60, height: 36, rx: 8, fill: '#f59e0b', opacity: '0.8' });
        g.appendChild(inRect);
        const inTxt = svgEl('text', { x: x + 45, y: 243, 'text-anchor': 'middle', fill: '#fff', 'font-size': '13', 'font-weight': '600' });
        inTxt.textContent = 'x' + (i + 1);
        g.appendChild(inTxt);
        // Input arrow up
        g.appendChild(svgEl('line', { x1: x + 45, y1: 218, x2: x + 45, y2: 174, stroke: '#f59e0b', 'stroke-width': 2, 'marker-end': 'url(#a1)' }));

        // Output y_t
        const outRect = svgEl('rect', { x: x + 15, y: 30, width: 60, height: 36, rx: 8, fill: '#8b5cf6', opacity: '0.8' });
        g.appendChild(outRect);
        const outTxt = svgEl('text', { x: x + 45, y: 53, 'text-anchor': 'middle', fill: '#fff', 'font-size': '13', 'font-weight': '600' });
        outTxt.textContent = 'y' + (i + 1);
        g.appendChild(outTxt);
        // Output arrow up
        g.appendChild(svgEl('line', { x1: x + 45, y1: 98, x2: x + 45, y2: 70, stroke: '#8b5cf6', 'stroke-width': 2, 'marker-end': 'url(#a2)' }));

        // Hidden state h arrow to next
        if (i < steps.length - 1) {
            g.appendChild(svgEl('line', { x1: x + 92, y1: 135, x2: x + 146, y2: 135, stroke: '#3b82f6', 'stroke-width': 2.5, 'marker-end': 'url(#a1)' }));

    s.appendChild(svg);
}

/* ══════════════════════════════════════════════════

async function scene3() {
    const s = document.getElementById('scene-3');

    // Chain rule visualization
    const g = svgEl('g', {});
    g.style.opacity = '0';
    g.style.animation = 'fadeInUp 0.5s ease 0.6s forwards';

    // BPTT chain
    const chain = ['∂L/∂h₄', '×', '∂h₄/∂h₃', '×', '∂h₃/∂h₂', '×', '∂h₂/∂h₁'];
    const chainColors = ['#ef4444', '#64748b', '#f59e0b', '#64748b', '#f59e0b', '#64748b', '#f59e0b'];
    let cx = 30;
    chain.forEach((txt, i) => {
        const t = svgEl('text', { x: cx, y: 50, fill: chainColors[i], 'font-size': txt.length > 1 ? '13' : '16', 'font-weight': txt.length > 1 ? '600' : '400' });

        g.appendChild(t);
        cx += txt.length > 1 ? 85 : 20;

    formTxt.textContent = '= Π (∂hₜ/∂hₜ₋₁)  ← 连乘导致指数级变化';
    g.appendChild(formTxt);

    // Three scenarios
    const scenarios = [
        { label: '|W| < 1', desc: '梯度消失', color: '#ef4444', bars: [1, 0.5, 0.25, 0.12, 0.06], y: 120 },
        { label: '|W| ≈ 1', desc: '梯度稳定', color: '#10b981', bars: [1, 0.95, 0.9, 0.88, 0.85], y: 170 },
        { label: '|W| > 1', desc: '梯度爆炸', color: '#f59e0b', bars: [1, 2, 4, 8, 16], y: 220 }
    ];

    scenarios.forEach((sc, si) => {
        const sg = svgEl('g', {});
        sg.style.opacity = '0';
        sg.style.animation = `fadeInUp 0.4s ease ${1.2 + si * 0.3}s forwards`;

        const label = svgEl('text', { x: 30, y: sc.y + 22, fill: sc.color, 'font-size': '13', 'font-weight': '600' });
        label.textContent = sc.label;
        sg.appendChild(label);

        const desc = svgEl('text', { x: 110, y: sc.y + 22, fill: '#94a3b8', 'font-size': '12' });
        desc.textContent = sc.desc;
        sg.appendChild(desc);

        // Bar chart
        const maxBar = sc.label.includes('>') ? 16 : 1;
        sc.bars.forEach((val, bi) => {
            const barH = Math.min(28, (val / maxBar) * 28);
            const bx = 200 + bi * 100;
            sg.appendChild(svgEl('rect', { x: bx, y: sc.y + 28 - barH, width: 50, height: barH, rx: 4, fill: sc.color, opacity: '0.7' }));
            const bLabel = svgEl('text', { x: bx + 25, y: sc.y + 46, 'text-anchor': 'middle', fill: '#64748b', 'font-size': '10' });

    svg.appendChild(g);
    s.appendChild(svg);

    await sleep(2000);
    const note = el('div', { class: 'formula-box fade-in-up' }, [
        '解决方案：LSTM 门控机制 → 控制信息的遗忘与保留'
    ]);
    s.appendChild(note);
}

/* ══════════════════════════════════════════════════
   runAnimation
   ══════════════════════════════════════════════════ */
async function runAnimation() {
    // Build scene dots
    const indicator = document.getElementById('scene-indicator');
    for (let i = 0; i < TOTAL_SCENES; i++) {
        indicator.appendChild(el('div', { class: 'scene-dot' }));
    }

    startTime = Date.now();
    const timer = setInterval(() => {
        updateProgress();
        updateSubtitle(Date.now() - startTime);
    }, 100);

    showScene(0);
    await scene0();
    await waitForSubtitle('计算新的隐藏状态');
    await sleep(2000);
    clearScene(0);

    showScene(1);
    await scene1();
    await waitForSubtitle('同一组参数');
    await sleep(2000);
    clearScene(1);

    showScene(2);
    await scene2();
    await waitForSubtitle('前向传播');
    await sleep(4000);
    clearScene(2);

    showScene(3);
    await scene3();
    await waitForSubtitle('LSTM');
    await sleep(2000);
    clearScene(3);

    showScene(4);
    await scene4();
    await waitForSubtitle('选择性暴露');
    await sleep(3000);

    clearInterval(timer);
    document.getElementById('progress').style.width = '100%';
}
window.onload = runAnimation;
</script>
