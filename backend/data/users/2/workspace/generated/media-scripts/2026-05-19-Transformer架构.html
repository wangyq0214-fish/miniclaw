<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformer 架构</title>
<style>
:root {
    --bg-color: #f8faff;
    --primary-color: #6366f1;
    --secondary-color: #22d3ee;
    --accent-color: #f59e0b;
    --text-main: #1e293b;
    --text-sub: #64748b;
    --node-bg: #ffffff;
    --line-color: #cbd5e1;
    --danger-color: #ef4444;
    --success-color: #10b981;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #e2e8f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    overflow: hidden;
}
#canvas-container {
    width: 1920px; height: 1080px;
    background: white;
    position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    overflow: hidden;
    display: flex; flex-direction: column;
    transform-origin: center;
}
#header {
    position: absolute; top: 30px; left: 0; right: 0;
    text-align: center; z-index: 10;
}
#header h1 {
    font-size: 48px; font-weight: 700;
    color: var(--primary-color);
    letter-spacing: 4px;
}
#stage {
    flex: 1; position: relative;
    display: flex; align-items: center; justify-content: center;
}
#main-svg { width: 100%; height: 100%; }
#subtitle-container {
    position: absolute; bottom: 80px; left: 0; right: 0;
    text-align: center; z-index: 20;
    pointer-events: none;
}
.subtitle-zh {
    font-size: 32px; font-weight: 600;
    color: var(--text-main);
    text-shadow: 0 2px 8px rgba(255,255,255,0.9);
    margin-bottom: 8px; min-height: 44px;
    padding: 0 100px;
}
#progress-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 6px; background: #e2e8f0; z-index: 30;
}
#progress {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
    transition: width 0.3s;
    border-radius: 0 3px 3px 0;
}
[id^="scene-"] {
    position: absolute; inset: 0;
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease;
}
[id^="scene-"].active {
    opacity: 1; pointer-events: auto;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}
@keyframes flow {
    0% { stroke-dashoffset: 20; }
    100% { stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<div id="canvas-container">
    <div id="header"><h1>Transformer 架构</h1></div>
    <div id="stage">
        <svg id="main-svg" viewBox="0 0 1920 1080">
            <defs>
                <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
                    <path d="M0,0 L12,4 L0,8 Z" fill="var(--primary-color)" />
                </marker>
                <marker id="arrow-accent" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
                    <path d="M0,0 L12,4 L0,8 Z" fill="var(--accent-color)" />
                </marker>
                <marker id="arrow-cyan" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
                    <path d="M0,0 L12,4 L0,8 Z" fill="var(--secondary-color)" />
                </marker>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="4" result="blur" />
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
                <filter id="glow-accent">
                    <feGaussianBlur stdDeviation="6" result="blur" />
                    <feFlood flood-color="var(--accent-color)" flood-opacity="0.3" result="color"/>
                    <feComposite in="color" in2="blur" operator="in" result="shadow"/>
                    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
                <linearGradient id="gradient-q" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#818cf8" />
                    <stop offset="100%" style="stop-color:#6366f1" />
                </linearGradient>
                <linearGradient id="gradient-k" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#34d399" />
                    <stop offset="100%" style="stop-color:#10b981" />
                </linearGradient>
                <linearGradient id="gradient-v" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#fbbf24" />
                    <stop offset="100%" style="stop-color:#f59e0b" />
                </linearGradient>
            </defs>
        </svg>
    </div>
    <div id="subtitle-container">
        <div class="subtitle-zh" id="subtitle-cn"></div>
    </div>
    <div id="progress-bar"><div id="progress"></div></div>
</div>

<script>
const subtitles = [
            { time: 0,       cn: "同学们好！上节课我们学习了 RNN，但 RNN 有个很大的问题——无法并行计算，训练非常慢", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/0_32a1602e469a.mp3" },
            { time: 9500,    cn: "2017 年，Google 提出了 Transformer 架构，彻底改变了这一切", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/1_89be6cfb1ef7.mp3" },
            { time: 15000,   cn: "Transformer 的核心创新就是自注意力机制。什么是注意力呢？", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/2_673da131567c.mp3" },
            { time: 21500,   cn: "想象一下，当你读一句话时，你的大脑会自动关注重要的词语，这就是注意力", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/3_d28c781722b0.mp3" },
            { time: 29000,   cn: "在 Transformer 中，每个词都会生成三个向量：Query、Key 和 Value", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/4_fa4e8d9d9f3e.mp3" },
            { time: 40500,   cn: "Query 是查询，就像你在搜索引擎输入的关键词", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/5_80c233ac7496.mp3" },
            { time: 47000,   cn: "Key 是键，就像网页的标题，用来匹配你的查询", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/6_3ee54810915f.mp3" },
            { time: 53500,   cn: "Value 是值，就是网页的实际内容，匹配度越高，权重越大", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/7_0bfd7e505025.mp3" },
            { time: 61000,   cn: "现在我们来看注意力是怎么计算的。首先用 Query 和 Key 做点积", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/8_9c69f98fa250.mp3" },
            { time: 70500,   cn: "点积越大，说明这两个词越相关。然后通过 Softmax 归一化", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/9_11773a9a0e4f.mp3" },
            { time: 79000,   cn: "Softmax 把分数变成概率，所有注意力权重加起来等于 1", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/10_24d7c589c74f.mp3" },
            { time: 87500,   cn: "最后用这些权重对 Value 加权求和，就得到了注意力的输出", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/11_c5452be15877.mp3" },
            { time: 96000,   cn: "但一组 QKV 可能不够，所以我们用多头注意力", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/12_51c8171435fa.mp3" },
            { time: 103500,  cn: "多个注意力头并行计算，每个头关注不同的特征", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/13_1bbc74b252fe.mp3" },
            { time: 110500,  cn: "有的头关注语法关系，有的头关注语义相似性", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/14_9db5aa3d90cd.mp3" },
            { time: 117500,  cn: "等等！注意力机制没有位置信息，它不知道词的顺序", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/15_462e15f48b68.mp3" },
            { time: 124500,  cn: "所以我们需要加入位置编码，告诉每个词" +
                    "" +
                    "它在句子中的位置", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/16_7289b538dc06.mp3" },
            { time: 131500,  cn: "有了 Transformer，GPT、BERT 等大模型才成为可能", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/17_70cea792dc88.mp3" },
            { time: 140500,  cn: "今天的人工智能革命，很大程度上要归功于 Transformer！", audio: "/api/tts/audio/2/2026-05-19-Transformer架构/18_cffa7685f96e.mp3" }
        ];

const TOTAL_DURATION = 148000;

// Scene time boundaries
const SCENE_TIMES = [
    { scene: 0, start: 0, end: 15000 },        // Intro (2条字幕)
    { scene: 1, start: 15000, end: 29000 },     // Self-Attention (2条字幕)
    { scene: 2, start: 29000, end: 61000 },     // QKV (4条字幕)
    { scene: 3, start: 61000, end: 96000 },     // Attention Calculation (4条字幕)
    { scene: 4, start: 96000, end: 117500 },    // Multi-Head (3条字幕)
    { scene: 5, start: 117500, end: 131500 },   // Positional Encoding (2条字幕)
    { scene: 6, start: 131500, end: 148000 }    // Applications (2条字幕)
];
let startTime;
let currentSubtitleIndex = -1;
let currentAudio = null;

function updateProgress() {
    const elapsed = Date.now() - startTime;
    const pct = Math.min(elapsed / TOTAL_DURATION * 100, 100);
    document.getElementById('progress').style.width = pct + '%';
}

function playAudio(audioUrl) {
    if (!audioUrl) return;
    if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
    }
    currentAudio = new Audio(audioUrl);
    currentAudio.play().catch(e => console.log('Audio play failed:', e));
}

function updateSubtitle(elapsed) {
    for (let i = subtitles.length - 1; i >= 0; i--) {
        if (elapsed >= subtitles[i].time) {
            if (currentSubtitleIndex !== i) {
                currentSubtitleIndex = i;
                document.getElementById('subtitle-cn').textContent = subtitles[i].cn;
                if (subtitles[i].audio) {
                    playAudio(subtitles[i].audio);
                }
            }
            break;
        }
    }
}

function el(tag, attrs, children) {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    if (attrs) Object.entries(attrs).forEach(([k, v]) => {
        if (k === 'style' && typeof v === 'object') {
            Object.entries(v).forEach(([sk, sv]) => e.style[sk] = sv);
        } else if (k.startsWith('on')) {
            e.addEventListener(k.slice(2).toLowerCase(), v);
        } else {
            e.setAttribute(k, v);
        }
    });
    if (children) {
        if (typeof children === 'string') e.textContent = children;
        else if (Array.isArray(children)) children.forEach(c => { if (c) e.appendChild(c); });
        else e.appendChild(children);
    }
    return e;
}

function makeCircle(cx, cy, r, fill, stroke, sw) {
    return el('circle', { cx, cy, r, fill: fill || 'white', stroke: stroke || 'var(--primary-color)', 'stroke-width': sw || 3 });
}

function makeRect(x, y, w, h, fill, stroke, sw, rx) {
    return el('rect', { x, y, width: w, height: h, fill: fill || 'white', stroke: stroke || 'var(--primary-color)', 'stroke-width': sw || 3, rx: rx || 8 });
}

function makeText(x, y, text, size, fill, anchor, weight) {
    return el('text', { x, y, 'font-size': size || 24, fill: fill || 'var(--text-main)', 'text-anchor': anchor || 'middle', 'font-weight': weight || 'bold', 'font-family': "'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" }, text);
}

function makeLine(x1, y1, x2, y2, color, sw, dasharray) {
    const attrs = { x1, y1, x2, y2, stroke: color || 'var(--line-color)', 'stroke-width': sw || 2 };
    if (dasharray) attrs['stroke-dasharray'] = dasharray;
    return el('line', attrs);
}

function makePath(d, color, sw, fill, markerEnd) {
    const attrs = { d, stroke: color || 'var(--line-color)', 'stroke-width': sw || 2, fill: fill || 'none' };
    if (markerEnd) attrs['marker-end'] = markerEnd;
    return el('path', attrs);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// Wait until playback reaches a specific time
function waitForTime(targetTime) {
    return new Promise(resolve => {
        const check = setInterval(() => {
            const elapsed = Date.now() - startTime;
            if (elapsed >= targetTime) { clearInterval(check); resolve(); }
        }, 100);
    });
}

// Keep animation running until the end of this scene
function waitUntilSceneEnd(sceneIndex) {
    const scene = SCENE_TIMES[sceneIndex];
    if (!scene) return Promise.resolve();
    return waitForTime(scene.end);
}

function clearScene() {
    const svg = document.getElementById('main-svg');
    const toRemove = [];
    for (const child of svg.children) {
        if (child.tagName !== 'defs') toRemove.push(child);
    }
    toRemove.forEach(e => e.remove());
}

// ============ Scene 0: Introduction (9.5s) ============
async function scene0() {
    const svg = document.getElementById('main-svg');
    const g = el('g', {});
    svg.appendChild(g);

    const title = makeText(960, 150, '为什么需要 Transformer？', 52, 'var(--primary-color)');
    title.style.opacity = '0';
    g.appendChild(title);
    setTimeout(() => { title.style.transition = 'opacity 0.5s'; title.style.opacity = '1'; }, 200);

    await sleep(800);

    const rnnBox = makeRect(200, 280, 500, 300, '#fef2f2', 'var(--danger-color)', 3, 16);
    rnnBox.style.opacity = '0';
    g.appendChild(rnnBox);
    const rnnTitle = makeText(450, 330, 'RNN 的问题', 28, 'var(--danger-color)');
    rnnTitle.style.opacity = '0';
    g.appendChild(rnnTitle);

    const problems = ['无法并行计算', '训练速度慢', '长距离依赖困难'];
    problems.forEach((p, i) => {
        const text = makeText(450, 390 + i * 50, '✗ ' + p, 22, 'var(--danger-color)', 'middle', 'normal');
        text.style.opacity = '0';
        g.appendChild(text);
        setTimeout(() => { text.style.transition = 'opacity 0.3s'; text.style.opacity = '1'; }, 1500 + i * 400);
    });

    setTimeout(() => { rnnBox.style.transition = 'opacity 0.5s'; rnnBox.style.opacity = '1'; }, 500);
    setTimeout(() => { rnnTitle.style.transition = 'opacity 0.5s'; rnnTitle.style.opacity = '1'; }, 700);

    await sleep(3000);

    const arrow = makePath('M730,430 L830,430', 'var(--accent-color)', 4, 'none', 'url(#arrow-accent)');
    arrow.style.opacity = '0';
    g.appendChild(arrow);
    setTimeout(() => { arrow.style.transition = 'opacity 0.3s'; arrow.style.opacity = '1'; }, 300);

    const transBox = makeRect(860, 280, 500, 300, '#f0fdf4', 'var(--success-color)', 3, 16);
    transBox.style.opacity = '0';
    g.appendChild(transBox);
    const transTitle = makeText(1110, 330, 'Transformer 的优势', 28, 'var(--success-color)');
    transTitle.style.opacity = '0';
    g.appendChild(transTitle);

    const solutions = ['完全并行计算', '训练速度极快', '强大的注意力机制'];
    solutions.forEach((s, i) => {
        const text = makeText(1110, 390 + i * 50, '✓ ' + s, 22, 'var(--success-color)', 'middle', 'normal');
        text.style.opacity = '0';
        g.appendChild(text);
        setTimeout(() => { text.style.transition = 'opacity 0.3s'; text.style.opacity = '1'; }, 1000 + i * 400);
    });

    setTimeout(() => { transBox.style.transition = 'opacity 0.5s'; transBox.style.opacity = '1'; }, 600);
    setTimeout(() => { transTitle.style.transition = 'opacity 0.5s'; transTitle.style.opacity = '1'; }, 800);

    await sleep(3500);

    const badge = makeRect(800, 650, 320, 60, 'var(--primary-color)', 'none', 0, 30);
    badge.style.opacity = '0';
    g.appendChild(badge);
    const yearText = makeText(960, 688, '2017 · Google · Attention Is All You Need', 22, 'white');
    yearText.style.opacity = '0';
    g.appendChild(yearText);
    setTimeout(() => {
        badge.style.transition = 'opacity 0.5s'; badge.style.opacity = '1';
        yearText.style.transition = 'opacity 0.5s'; yearText.style.opacity = '1';
    }, 500);
}

// ============ Scene 1: Self-Attention Intuition (8s) ============
async function scene1() {
    const svg = document.getElementById('main-svg');
    const g = el('g', {});
    svg.appendChild(g);

    const title = makeText(960, 100, '自注意力机制：让每个词关注其他词', 44, 'var(--primary-color)');
    title.style.opacity = '0';
    g.appendChild(title);
    setTimeout(() => { title.style.transition = 'opacity 0.5s'; title.style.opacity = '1'; }, 200);

    await sleep(500);

    const words = ['我', '喜欢', '吃', '苹果', '因为', '它', '很', '甜'];
    const wordY = 250;
    const startX = 300;
    const gap = 170;

    words.forEach((w, i) => {
        const box = makeRect(startX + i * gap - 50, wordY - 25, 100, 50, 'white', 'var(--primary-color)', 2, 8);
        box.style.opacity = '0';
        g.appendChild(box);
        const text = makeText(startX + i * gap, wordY + 8, w, 28, 'var(--text-main)');
        text.style.opacity = '0';
        g.appendChild(text);
        setTimeout(() => {
            box.style.transition = 'opacity 0.3s'; box.style.opacity = '1';
            text.style.transition = 'opacity 0.3s'; text.style.opacity = '1';
        }, 500 + i * 200);
    });

    await sleep(2500);

    const highlight = makeRect(startX + 5 * gap - 55, wordY - 30, 110, 60, '#fef3c7', 'var(--accent-color)', 3, 8);
    highlight.style.opacity = '0';
    g.appendChild(highlight);
    setTimeout(() => { highlight.style.transition = 'opacity 0.3s'; highlight.style.opacity = '1'; }, 300);

    const attentionTargets = [
        { idx: 0, weight: 0.1, label: '我' },
        { idx: 3, weight: 0.7, label: '苹果' },
        { idx: 7, weight: 0.2, label: '甜' }
    ];

    attentionTargets.forEach((t, i) => {
        const x2 = startX + t.idx * gap;
        const x1 = startX + 5 * gap;
        const line = makeLine(x1, wordY + 30, x2, wordY + 100 + i * 40, 'var(--accent-color)', t.weight * 8);
        line.style.opacity = '0';
        g.appendChild(line);

        const dot = makeCircle(x2, wordY + 100 + i * 40, t.weight * 20 + 5, 'var(--accent-color)', 'none', 0);
        dot.style.opacity = '0';
        g.appendChild(dot);

        const label = makeText(x2, wordY + 110 + i * 40 + 25, `${t.label}: ${(t.weight * 100).toFixed(0)}%`, 16, 'var(--accent-color)', 'middle', 'normal');
        label.style.opacity = '0';
        g.appendChild(label);

        setTimeout(() => {
            line.style.transition = 'opacity 0.3s'; line.style.opacity = '0.6';
            dot.style.transition = 'opacity 0.3s'; dot.style.opacity = '1';
            label.style.transition = 'opacity 0.3s'; label.style.opacity = '1';
        }, 1000 + i * 500);
    });

    await sleep(2500);

    const explain = makeText(960, 550, '"它" 最关注的是 "苹果"，注意力权重高达 70%', 30, 'var(--accent-color)');
    explain.style.opacity = '0';
    g.appendChild(explain);
    setTimeout(() => { explain.style.transition = 'opacity 0.5s'; explain.style.opacity = '1'; }, 500);

    await sleep(1500);

    const note = makeText(960, 650, '这就是注意力——自动学习词语之间的关联', 26, 'var(--text-sub)', 'middle', 'normal');
    note.style.opacity = '0';
    g.appendChild(note);
    setTimeout(() => { note.style.transition = 'opacity 0.5s'; note.style.opacity = '1'; }, 500);
}

// ============ Scene 2: Q, K, V (11s) ============
async function scene2() {
    const svg = document.getElementById('main-svg');
    const g = el('g', {});
    svg.appendChild(g);

    const title = makeText(960, 80, 'Query、Key、Value 三元组', 44, 'var(--primary-color)');
    title.style.opacity = '0';
    g.appendChild(title);
    setTimeout(() => { title.style.transition = 'opacity 0.5s'; title.style.opacity = '1'; }, 200);

    await sleep(500);

    const columns = [
        { name: 'Query (查询)', color: '#818cf8', desc: '我在找什么？', icon: '🔍', x: 300 },
        { name: 'Key (键)', color: '#34d399', desc: '我有什么标签？', icon: '🏷️', x: 760 },
        { name: 'Value (值)', color: '#fbbf24', desc: '我的实际内容', icon: '📦', x: 1220 }
    ];

    columns.forEach((col, i) => {
        const box = makeRect(col.x - 150, 200, 300, 350, 'white', col.color, 3, 16);
        box.style.opacity = '0';
        g.appendChild(box);
        const icon = makeText(col.x, 280, col.icon, 64, 'var(--text-main)');
        icon.style.opacity = '0';
        g.appendChild(icon);
        const name = makeText(col.x, 370, col.name, 28, col.color);
        name.style.opacity = '0';
        g.appendChild(name);
        const desc = makeText(col.x, 430, col.desc, 22, 'var(--text-sub)', 'middle', 'normal');
        desc.style.opacity = '0';
        g.appendChild(desc);

        setTimeout(() => {
            box.style.transition = 'opacity 0.4s'; box.style.opacity = '1';
            icon.style.transition = 'opacity 0.4s'; icon.style.opacity = '1';
            name.style.transition = 'opacity 0.4s'; name.style.opacity = '1';
            desc.style.transition = 'opacity 0.4s'; desc.style.opacity = '1';
        }, 800 + i * 1500);
    });

    await sleep(5500);

    const analogyBox = makeRect(260, 600, 1000, 100, '#f8fafc', 'var(--line-color)', 2, 12);
    analogyBox.style.opacity = '0';
    g.appendChild(analogyBox);
    const analogy = makeText(760, 660, '就像搜索引擎：Query 是你的搜索词，Key 是网页标题，Value 是网页内容', 24, 'var(--text-sub)', 'middle', 'normal');
    analogy.style.opacity = '0';

    document.getElementById('progress').style.width = '100%';
}

window.onload = runAnimation;
</script>
