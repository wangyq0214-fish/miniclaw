<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-OpenClaw Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .banner {
            width: 1280px;
            height: 640px;
            background: linear-gradient(135deg, #FFFFFF 0%, #F8FAFC 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .banner::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.5; }
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .logo {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 64px;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 32px;
            font-weight: 400;
            color: #475569;
            margin-bottom: 24px;
        }

        .features {
            font-size: 20px;
            color: #64748B;
            margin-bottom: 40px;
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feature::before {
            content: '•';
            color: #3B82F6;
            font-weight: bold;
        }

        .tech-stack {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .tech-tag {
            padding: 12px 24px;
            background: #EFF6FF;
            border: 1px solid #3B82F6;
            border-radius: 8px;
            color: #1E40AF;
            font-size: 16px;
            font-weight: 500;
        }

        .corner-decoration {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
        }

        .corner-decoration.top-left {
            top: -100px;
            left: -100px;
        }

        .corner-decoration.bottom-right {
            bottom: -100px;
            right: -100px;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="corner-decoration top-left"></div>
        <div class="corner-decoration bottom-right"></div>

        <div class="content">
            <div class="logo">🎓</div>
            <h1 class="title">Mini-OpenClaw</h1>
            <p class="subtitle">AI Agent 教育辅助系统</p>

            <div class="features">
                <span class="feature">文件驱动架构</span>
                <span class="feature">Agent全程可视化</span>
                <span class="feature">11种内置技能</span>
            </div>

            <div class="tech-stack">
                <span class="tech-tag">DeepAgents</span>
                <span class="tech-tag">LlamaIndex</span>
                <span class="tech-tag">Neo4j</span>
                <span class="tech-tag">FastAPI</span>
                <span class="tech-tag">Next.js</span>
            </div>
        </div>
    </div>

    <script>
        // 截图提示
        console.log('Banner图已生成！请使用浏览器截图工具截取1280x640px区域。');
        console.log('推荐使用浏览器开发者工具的截图功能：');
        console.log('1. 按F12打开开发者工具');
        console.log('2. 按Ctrl+Shift+P打开命令面板');
        console.log('3. 输入"screenshot"选择"Capture screenshot"');
    </script>
</body>
</html>
