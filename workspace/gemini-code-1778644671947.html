<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习效果评估仪表盘 - Mini OpenClaw</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Chart.js 用于渲染图表 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 隐藏滚动条 */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-[#fbfbfc] text-gray-800 font-sans min-h-screen p-6 md:p-10">

    <div class="max-w-6xl mx-auto flex flex-col gap-6">
        
        <!-- 1. 顶部控制栏 -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-2">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">学习效果评估与能力分析</h1>
                <p class="text-sm text-gray-500 mt-1">基于你最近的学习记录与测试表现生成的智能洞察</p>
            </div>
            
            <!-- 筛选项（仅为 UI 演示） -->
            <div class="flex items-center gap-3 bg-white p-1 rounded-lg border border-gray-200 shadow-sm w-fit">
                <button class="px-4 py-1.5 text-sm font-medium bg-[#f0f4ff] text-blue-600 rounded-md transition-colors">全部学科</button>
                <button class="px-4 py-1.5 text-sm font-medium text-gray-500 hover:text-gray-800 transition-colors">机器学习</button>
                <button class="px-4 py-1.5 text-sm font-medium text-gray-500 hover:text-gray-800 transition-colors">食品安全</button>
            </div>
        </header>

        <!-- 2. 核心数据总览 (Stat Cards) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- 卡片 1 -->
            <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-[0_2px_12px_-4px_rgba(0,0,0,0.04)] relative overflow-hidden">
                <div class="text-sm font-medium text-gray-500 mb-2 flex items-center gap-2">
                    <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path></svg>
                    当前综合评分
                </div>
                <div class="flex items-baseline gap-2">
                    <span class="text-4xl font-bold text-gray-900">86</span>
                    <span class="text-sm font-medium text-green-500 flex items-center">
                        <svg class="w-3 h-3 mr-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                        +4.2%
                    </span>
                </div>
                <div class="absolute -right-4 -bottom-4 opacity-5"><svg class="w-24 h-24" fill="currentColor" viewBox="0 0 20 20"><path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"></path></svg></div>
            </div>
            
            <!-- 卡片 2 -->
            <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-[0_2px_12px_-4px_rgba(0,0,0,0.04)]">
                <div class="text-sm font-medium text-gray-500 mb-2 flex items-center gap-2">
                    <svg class="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    有效学习时长
                </div>
                <div class="flex items-baseline gap-2">
                    <span class="text-4xl font-bold text-gray-900">32.5</span>
                    <span class="text-sm text-gray-500">小时</span>
                </div>
            </div>

            <!-- 卡片 3 -->
            <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-[0_2px_12px_-4px_rgba(0,0,0,0.04)]">
                <div class="text-sm font-medium text-gray-500 mb-2 flex items-center gap-2">
                    <svg class="w-4 h-4 text-teal-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    掌握知识点
                </div>
                <div class="flex items-baseline gap-2">
                    <span class="text-4xl font-bold text-gray-900">145</span>
                    <span class="text-sm text-gray-500">个</span>
                </div>
            </div>
        </div>

        <!-- 3. 图表分析区 (Grid) -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- 左侧：能力雷达图 -->
            <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-[0_2px_12px_-4px_rgba(0,0,0,0.04)] flex flex-col">
                <h3 class="text-base font-bold text-gray-800 mb-4">多维能力图谱</h3>
                <div class="flex-1 relative w-full flex items-center justify-center min-h-[300px]">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>

            <!-- 右侧：学习效果趋势图 -->
            <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-[0_2px_12px_-4px_rgba(0,0,0,0.04)] flex flex-col">
                <h3 class="text-base font-bold text-gray-800 mb-4">近 7 天学习得分趋势</h3>
                <div class="flex-1 relative w-full min-h-[300px]">
                    <canvas id="lineChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 4. 底部 AI 智能洞察 -->
        <div class="bg-gradient-to-r from-[#f0f4ff] to-[#f4faff] rounded-2xl p-6 border border-blue-100 shadow-sm relative overflow-hidden">
            <!-- 装饰图标 -->
            <div class="absolute -right-4 -top-6 text-9xl opacity-[0.03] select-none pointer-events-none">✨</div>
            
            <div class="flex gap-4">
                <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center shrink-0 shadow-md">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div>
                    <h3 class="text-base font-bold text-blue-900 mb-2">AI 智能洞察与行动建议</h3>
                    <p class="text-sm text-blue-800 leading-relaxed mb-3">
                        根据最近的测试数据，你的 <span class="font-bold text-blue-600 bg-blue-100/50 px-1.5 py-0.5 rounded">逻辑推演</span> 和 <span class="font-bold text-blue-600 bg-blue-100/50 px-1.5 py-0.5 rounded">综合应用</span> 能力表现非常出色（超过了 85% 的同学），这说明你已经很好地掌握了核心原理，能够举一反三。
                    </p>
                    <p class="text-sm text-blue-800 leading-relaxed">
                        不过，你在 <span class="font-bold text-amber-600 bg-amber-100/50 px-1.5 py-0.5 rounded">基础记忆</span> 维度略有下滑。建议明天可以重点复习一下 <strong class="text-blue-900 border-b border-blue-300">《预包装食品标签通则》的抽认卡</strong>，巩固硬性知识点。继续保持！
                    </p>
                </div>
            </div>
        </div>

    </div>

    <!-- 图表初始化脚本 -->
    <script>
        // 全局配置，修改 Chart.js 默认字体
        Chart.defaults.font.family = 'ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
        Chart.defaults.color = '#6b7280';

        // 1. 初始化雷达图 (Radar Chart)
        const ctxRadar = document.getElementById('radarChart').getContext('2d');
        new Chart(ctxRadar, {
            type: 'radar',
            data: {
                labels: ['基础记忆', '逻辑推演', '综合应用', '创新思维', '知识广度'],
                datasets: [{
                    label: '你的能力分值',
                    data: [65, 92, 88, 75, 80], // 模拟数据
                    backgroundColor: 'rgba(59, 130, 246, 0.2)', // Tailwind blue-500 透明度
                    borderColor: 'rgba(59, 130, 246, 1)',
                    borderWidth: 2,
                    pointBackgroundColor: '#fff',
                    pointBorderColor: 'rgba(59, 130, 246, 1)',
                    pointHoverBackgroundColor: 'rgba(59, 130, 246, 1)',
                    pointHoverBorderColor: '#fff',
                    pointRadius: 4,
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    r: {
                        angleLines: { color: 'rgba(243, 244, 246, 1)' }, // gray-100
                        grid: { color: 'rgba(243, 244, 246, 1)' },
                        pointLabels: {
                            font: { size: 13, weight: '600' },
                            color: '#374151' // gray-700
                        },
                        ticks: { display: false, min: 0, max: 100 } // 隐藏数值标签
                    }
                }
            }
        });

        // 2. 初始化折线图 (Line Chart)
        const ctxLine = document.getElementById('lineChart').getContext('2d');
        
        // 创建渐变填充色
        let gradient = ctxLine.createLinearGradient(0, 0, 0, 300);
        gradient.addColorStop(0, 'rgba(59, 130, 246, 0.4)'); // blue-500
        gradient.addColorStop(1, 'rgba(59, 130, 246, 0.0)');

        new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: ['5月1日', '5月2日', '5月3日', '5月4日', '5月5日', '5月6日', '今天'],
                datasets: [{
                    label: '每日得分',
                    data: [72, 75, 74, 82, 80, 85, 90], // 模拟趋势数据
                    fill: true,
                    backgroundColor: gradient,
                    borderColor: 'rgba(59, 130, 246, 1)',
                    borderWidth: 2.5,
                    tension: 0.4, // 让折线平滑成曲线 (贝塞尔曲线)
                    pointBackgroundColor: '#fff',
                    pointBorderColor: 'rgba(59, 130, 246, 1)',
                    pointBorderWidth: 2,
                    pointRadius: 4,
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(17, 24, 39, 0.8)', // gray-900
                        padding: 10,
                        titleFont: { size: 13 },
                        bodyFont: { size: 13, weight: 'bold' },
                        displayColors: false
                    }
                },
                interaction: { mode: 'index', intersect: false },
                scales: {
                    x: {
                        grid: { display: false, drawBorder: false },
                        ticks: { font: { size: 12 } }
                    },
                    y: {
                        grid: { color: 'rgba(243, 244, 246, 1)', drawBorder: false }, // gray-100
                        ticks: { font: { size: 12 }, padding: 10, stepSize: 10 },
                        min: 50,
                        max: 100
                    }
                }
            }
        });
    </script>
</body>
</html>
